<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>INOKUO Reel 3D</title>
<style>
  :root{ --navy:#1b3557; --blue:#3b6ea5; --green:#3fc38a; --white:#f5f8fb; --mist:#dbe6f0; }
  html,body{margin:0;padding:0;background:#0c1a2e;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;
    background:linear-gradient(180deg,#a9c7e3 0%,#cfe0ee 38%,#e9f0f6 62%,#d6e3ee 100%);font-family:'Inter','Inter Display',system-ui,sans-serif}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .layer{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
  #labels .lab{position:absolute;transform:translate(-50%,0);background:rgba(27,53,87,.92);color:#fff;font-weight:800;font-size:30px;letter-spacing:2px;padding:9px 20px 9px;border-radius:999px;white-space:nowrap;opacity:0;box-shadow:0 6px 18px rgba(20,40,70,.25)}
  #labels .lab b{color:var(--green)}
  #titleBox{position:absolute;left:60px;right:60px;top:250px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .tline{display:inline-block;background:rgba(27,53,87,.94);color:#fff;font-weight:900;font-size:76px;line-height:1.08;letter-spacing:-1px;padding:10px 26px 14px;border-radius:20px;box-shadow:0 10px 30px rgba(20,40,70,.28);transform-origin:0 50%}
  .tline .hl{color:var(--green)}
  #subs{position:absolute;left:70px;right:70px;top:1215px;text-align:center;font-weight:900;font-size:64px;line-height:1.16;color:#fff;
    text-shadow:0 3px 0 rgba(10,25,45,.9),0 0 18px rgba(10,25,45,.85),0 0 4px rgba(10,25,45,.9);-webkit-text-stroke:0}
  #subs .hl{color:#7ff0bd}
  #fade{background:#1b3557;opacity:0}
  #brand{display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;
    background:radial-gradient(120% 80% at 50% 38%,#2d5686 0%,#1b3557 55%,#102640 100%)}
  #brand .logoslot{width:620px;height:260px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  #brand .logoslot img{max-width:100%;max-height:100%}
  #brand .wm{font-weight:900;font-size:150px;letter-spacing:10px;color:#fff;line-height:1}
  #brand .wm2{font-weight:700;font-size:56px;letter-spacing:14px;color:#7ff0bd;margin-top:6px}
  #brand .bar{width:180px;height:8px;border-radius:4px;background:var(--green);margin:46px 0 40px}
  #brand .tag{font-weight:500;font-size:44px;color:#dbe6f0;text-align:center;line-height:1.3;max-width:800px}
  #brand .cta{margin-top:70px;min-height:96px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:46px;color:#fff;padding:0 54px;border-radius:999px}
  #brand .cta.on{background:var(--green);color:#10283f}
  #brand .web{margin-top:26px;font-weight:600;font-size:40px;color:#dbe6f0;min-height:50px}
  #safe{display:none;border:4px dashed rgba(255,0,0,.6);box-sizing:border-box}
  body.debug #safe{display:block}
</style></head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="labels" class="layer"></div>
  <div id="titleBox"></div>
  <div id="subs"></div>
  <div id="fade" class="layer"></div>
  <div id="brand" class="layer">
    <div class="logoslot" id="logoslot"></div>
    <div class="wm" id="wm">INOKUO</div>
    <div class="wm2" id="wm2">FORMACIÓN</div>
    <div class="bar" id="bbar"></div>
    <div class="tag" id="btag"></div>
    <div class="cta" id="bcta"></div>
    <div class="web" id="bweb"></div>
  </div>
  <div id="safe" class="layer" style="left:0;top:250px;height:1250px;width:1080px"></div>
</div>
<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module" src="/src/engine/main.js"></script>
</body></html>
